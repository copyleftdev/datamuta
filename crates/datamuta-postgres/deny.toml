# Source and license checks for the dependency probes. Security uses cargo-audit
# with --deny warnings, an up-to-date RustSec database, and no ignored advisories.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "OpenSSL"]
unused-allowed-license = "allow"

