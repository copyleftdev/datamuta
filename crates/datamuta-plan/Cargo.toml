[package]
name = "datamuta-plan"
version = "0.1.0"
description = "Bounded schema descriptions and lossless mapping compilation for Datamuta"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
datamuta-kernel = { path = "../datamuta-kernel", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
