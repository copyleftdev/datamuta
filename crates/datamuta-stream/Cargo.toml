[package]
name = "datamuta-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Experimental sealed partition spool and PostgreSQL streaming executor"
[workspace]
[dependencies]
datamuta-kernel = { path = "../datamuta-kernel", version = "=0.1.0" }
datamuta-plan = { path = "../datamuta-plan", version = "=0.1.0" }
datamuta-postgres = { path = "../datamuta-postgres", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["query", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.10"
[dev-dependencies]
tempfile = "=3.27.0"
[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
