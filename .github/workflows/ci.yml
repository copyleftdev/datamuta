name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [kernel, plan, postgres, stream]
    env:
      MANIFEST: crates/datamuta-${{ matrix.crate }}/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - run: cargo test --locked --manifest-path "$MANIFEST"
      - run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: ${{ env.MANIFEST }}
